[build-system]
requires = ["setuptools>=68", "wheel>=0.42"]
build-backend = "setuptools.build_meta"

[project]
name = "polarization-experiments"
version = "1.0.0"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["experiments*", "data*"]
exclude = ["tests*", "data.models*"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["runs/", "notebooks/", "data/models/"]

[tool.ruff.lint]
select = ["E","F","I","B","UP"]
ignore = [
    "E501", # no complaints from line length
    "F401", # allow importing unused modules (for __init__.py)
    "B006", # allow mutable default function arguments
]
