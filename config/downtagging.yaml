exp_type: downtagging
exp_name: downtagging

data:
  data_dir: data/tt_pol/
  mass_window: loose
  pid: true
  tag: [-3,-1,1,3]
  use_ditop: false
  ttsmeft: # tt_smeft data for dataset_eval=ttsmeft, must match the tt_smeft run
    data_dir: data/tt_smeft/
    mass_window: ${data.mass_window}
    lbl_0: sm
    bsm: im
    c_value: 2.6
    length: -1
    pid: true
    pseudoscalars: true
    tag_down: true

plotting:
 polarization: true

defaults:
 - tagging
 - _self_
