exp_type: test
exp_name: test

data:
  npy_path: data/pkl.npy
  split_fracs: [0.8, 0.1, 0.1]
  seed: 42
  shuffle: true
  length: -1
  tagging_features: all
  boost_jet: false
  beam_reference: lightlike
  two_beams: true
  add_time_reference: true
  mass_reg: 5e-3
  spurion_scale: 1
  momentum_float64: true


evaluation:
  batchsize: 512
  save_roc: false
  eval_set: [train, test, val]

plotting:
  roc: true
  loss: true
  score: true

defaults:
  - model: tag_transformer
  - training: tag_transformer
  - default
  - _self_
