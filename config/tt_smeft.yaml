exp_type: tt_smeft
exp_name: tt_smeft

data:
  data_dir: data/tt_smeft/
  lbl_0: sm # [sm|neg]
  bsm: im # [re|im|mix]
  c_value: 2.6
  cpflip_batch: false # only used with lbl_0=neg and bsm=im
  mass_window: loose
  pid: true
  pseudoscalars: true # jet-level pseudoscalars (eps, spin correlation)
  tag_down: true # tag the down quark in the input sequence

defaults:
 - tagging
 - _self_
