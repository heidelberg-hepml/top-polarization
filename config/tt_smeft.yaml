exp_type: tt_smeft
exp_name: tt_smeft

data:
  data_dir: data/tt_smeft/
  lbl_0: sm # sm | neg
  bsm: im # re | im | mix
  c_value: 2.6 # |c_tG| of the BSM files: 0.1 | 2.6
  cpflip_batch: false # only used with lbl_0=neg and bsm=im
  mass_window: loose
  pid: true
  tagging_features: beamsym # beam-swap symmetric dphi/deta features
  pseudoscalars: false # jet-level pseudoscalars (eps, spin correlation)
  tag_down: true # tag the down quark in the input sequence
  downtag_labels: null # labels.txt of a downtagging run, used with dataset_eval=downtag

defaults:
 - tagging
 - override model: tag_slim_pseudo
 - _self_
