exp_type: tagging
exp_name: tagging

data:
  data_dir: data/
  dataset: unpolarized
  mass_window: strict
  tag: down
  length: -1
  tagging_features: all
  boost_jet: false
  beam_reference: lightlike
  two_beams: true
  add_time_reference: true
  mass_reg: 5e-3
  spurion_scale: 1
  max_particles: null
  momentum_float64: true
  pid: true
  balance_factor: 0.8


evaluation:
 batchsize: 512
 save_roc: false
 eval_set: [train, test, val]

plotting:
 roc: true
 loss: true
 score: true

defaults:
 - default
 - model: tag_transformer
 - training: tag_default
 - _self_
