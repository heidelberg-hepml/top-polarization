exp_type: tagging
exp_name: tagging

data:
  data_dir: data/
  dataset: unpolarized
  dataset_eval: null
  mass_window: strict
  length: -1
  use_cache: true
  tagging_features: all
  boost_jet: false
  beam_reference: lightlike
  two_beams: true
  add_time_reference: true
  mass_reg: 5e-3
  spurion_scale: 1
  max_particles: null
  momentum_float64: true
  pid: true

train: true
model_load_idx: null

optuna: null

evaluation:
 batchsize: 512
 save_roc: false
 save_labels: true
 eval_set: [train, test, val]

plotting:
 roc: true
 loss: true
 score: true

defaults:
 - default
 - model: tag_transformer
 - training: tag_default
 - _self_
